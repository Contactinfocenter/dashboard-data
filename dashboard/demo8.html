<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Call Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
   
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap');
        body {
            font-family: 'Nunito Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center">
    <!-- Top Header -->
    <header class="sticky top-0 z-50 w-full glass-nav border-b border-slate-200 shadow-sm flex justify-center">
        <div class="w-full max-w-[1440px] px-4 lg:px-8">
            <div class="h-16 flex items-center justify-between gap-8">
                <div class="flex items-center shrink-0">
                    <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-blue-500/20">
                        <span class="text-white font-bold italic text-lg">P</span>
                    </div>
                    <span class="text-xl font-black tracking-tight text-slate-800 uppercase hidden sm:block">Phoenix</span>
                </div>
                <!-- Desktop Nav -->
                <nav class="hidden lg:flex items-center gap-1">
                    <button class="px-3 py-2 rounded-lg text-blue-600 bg-blue-50 text-sm font-bold flex items-center gap-1">
                        Dashboard <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-bold">Analytics</button>
                </nav>
                <!-- Actions & Date Filter in Header -->
                <div class="flex items-center gap-3 flex-1 justify-end">
                    <div class="relative hidden md:flex items-center">
                        <i data-lucide="calendar" class="absolute left-4 w-4 h-4 text-slate-500 z-10 pointer-events-none"></i>
                        <input type="text" id="datePicker" placeholder="Select Date" class="uppercase tracking-wider">
                    </div>
                    <button id="btnReload" class="w-10 h-10 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full transition-colors relative" title="Reload latest data">
                        <i data-lucide="refresh-cw" class="w-5 h-5 transition-transform duration-500" id="reloadIcon"></i>
                        <i data-lucide="loader-2" class="w-5 h-5 absolute animate-spin hidden" id="loadingIcon"></i>
                    </button>
                    <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center overflow-hidden border-2 border-transparent hover:border-blue-500 transition-all cursor-pointer">
                        <i data-lucide="user" class="w-5 h-5 text-slate-500"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1440px] p-4 lg:p-8 space-y-8">
        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-1.5">
                    <span>Call Analytics</span>
                    <i data-lucide="chevron-right" class="w-3 h-3"></i>
                    <span class="text-blue-600" id="selectedDateDisplay">Loading...</span>
                </div>
            </div>
        </div>
        <!-- Main Chart Section -->
        <div class="grid grid-cols-1 gap-8">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col">
                <div class="flex items-center justify-between -mb-8">
                    <div>
                        <h2 class="font-bold text-xl tracking-tight text-slate-900">Hourly Call Volume</h2>
                        <p class="text-sm text-slate-400 font-semibold mt-1">
                            Comparing <span id="selectedDate" class="text-blue-600">...</span> vs System Average
                        </p>
                    </div>
                </div>
                <!-- Chart Container -->
                <div id="avgHourlyChart" style="width: 100%; height: 450px;"></div>
            </div>
        </div>
        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-semibold tracking-wide mb-1 uppercase">Peak Hour</p>
                <h3 class="text-3xl font-black text-slate-900" id="statPeakHour">--:--</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-semibold tracking-wide mb-1 uppercase">Total Daily Calls</p>
                <h3 class="text-3xl font-black text-slate-900" id="statTotalCalls">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-semibold tracking-wide mb-1 uppercase">Avg Calls/Hour</p>
                <h3 class="text-3xl font-black text-slate-900" id="statAvgCalls">0</h3>
            </div>
        </div>
    </main>
    <script>
        const MASTER_DATA_URL = "https://raw.githubusercontent.com/Contactinfocenter/dashboard-data/main/data/calls/all_calls.json";
        let rawData = {};
        let selectedDate = null;
        let avgHourlyChart = null;
        let currentEnabledDates = [];
        let datePickerInstance = null;
        lucide.createIcons();

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function updateSelectedDateDisplay(dateStr) {
            const display = formatDateDisplay(dateStr);
            document.getElementById('selectedDate').textContent = display;
            document.getElementById('selectedDateDisplay').textContent = display;
        }

        function getCallsForDate(dateStr) {
            if (rawData[dateStr]) return rawData[dateStr];
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const key = `${parts[0]}-${Number(parts[1])}-${Number(parts[2])}`;
                return rawData[key] || {};
            }
            return {};
        }

        async function loadDataFromGitHub() {
            const reloadIcon = document.getElementById('reloadIcon');
            const loadingIcon = document.getElementById('loadingIcon');

            // Show loading spinner instantly
            reloadIcon.classList.add('hidden');
            loadingIcon.classList.remove('hidden');

            try {
                const res = await fetch(MASTER_DATA_URL + '?t=' + Date.now());
                const json = await res.json();
                const newRawData = json.calls || {};

                const availableDates = Object.keys(newRawData)
                    .filter(key => /^\d{4}-\d{1,2}-\d{1,2}$/.test(key))
                    .sort((a, b) => new Date(b) - new Date(a));

                const newLatestDate = availableDates.length > 0 ? availableDates[0] : selectedDate;

                // Only update if data actually changed
                if (JSON.stringify(newRawData) !== JSON.stringify(rawData) || selectedDate !== newLatestDate) {
                    rawData = newRawData;
                    selectedDate = newLatestDate;
                    updateSelectedDateDisplay(selectedDate);
                    renderHourlyChart();
                    initDatePicker(); // Only reinits if dates changed
                }
            } catch (err) {
                console.error("Failed to load data", err);
                alert("Failed to reload data. Please try again.");
            } finally {
                // Hide spinner and animate success
                loadingIcon.classList.add('hidden');
                reloadIcon.classList.remove('hidden');
                reloadIcon.style.transform = 'rotate(360deg)';
                setTimeout(() => { reloadIcon.style.transform = ''; }, 600);
            }
        }

        function computeAvgHourlyVolume() {
            const hourly = Array(24).fill(0);
            let dayCount = 0;
            for (const date in rawData) {
                const calls = rawData[date];
                const daily = Array(24).fill(0);
                let hasCalls = false;
                for (const id in calls) {
                    const callDate = new Date(calls[id].call_date);
                    if (!isNaN(callDate)) {
                        daily[callDate.getHours()]++;
                        hasCalls = true;
                    }
                }
                if (hasCalls) {
                    dayCount++;
                    for (let h = 0; h < 24; h++) hourly[h] += daily[h];
                }
            }
            return hourly.map(v => dayCount > 0 && v > 0 ? Math.round(v / dayCount) : null);
        }

        function computeSelectedDateHourlyVolume(dateStr) {
            const calls = getCallsForDate(dateStr);
            const hourly = Array(24).fill(0);
            let total = 0;
            for (const id in calls) {
                const callDate = new Date(calls[id].call_date);
                if (!isNaN(callDate)) {
                    hourly[callDate.getHours()]++;
                    total++;
                }
            }

            document.getElementById('statTotalCalls').textContent = total.toLocaleString();
            document.getElementById('statAvgCalls').textContent = Math.round(total / 24);
            const peakVal = Math.max(...hourly.filter(v => v > 0), 0);
            const peakHour = hourly.indexOf(peakVal);
            document.getElementById('statPeakHour').textContent = peakHour > -1 && peakVal > 0 ? `${peakHour.toString().padStart(2, '0')}:00` : '--:--';

            return hourly.map(v => v > 0 ? v : null);
        }

        function renderHourlyChart() {
            const avgData = computeAvgHourlyVolume();
            const todayData = computeSelectedDateHourlyVolume(selectedDate);
            const chartDom = document.getElementById('avgHourlyChart');
            if (!chartDom) return;
            if (avgHourlyChart) avgHourlyChart.dispose();
            avgHourlyChart = echarts.init(chartDom);
            const primaryColor = '#3874ff';
            const hours = Array.from({length: 24}, (_, i) => `${i.toString().padStart(2, '0')}:00`);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    padding: [12, 16],
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#e2e8f0',
                    textStyle: { color: '#1e293b', fontWeight: 600 },
                    extraCssText: 'box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 8px;'
                },
                legend: {
                    show: true,
                    top: '0%',
                    right: '0%',
                    icon: 'circle',
                    itemGap: 20,
                    textStyle: { color: '#64748b', fontWeight: 700, fontSize: 11 }
                },
                grid: {
                    left: '1%',
                    right: '1%',
                    top: '15%',
                    bottom: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: hours,
                    boundaryGap: false,
                    axisLine: { show: true, lineStyle: { color: '#f1f5f9' } },
                    axisTick: { show: false },
                    axisLabel: {
                        color: '#94a3b8',
                        fontWeight: 700,
                        margin: 20,
                        fontSize: 11,
                        interval: 2
                    },
                    splitLine: {
                        show: true,
                        lineStyle: { color: '#f1f5f9', width: 1 }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#94a3b8',
                        fontWeight: 700,
                        fontSize: 11
                    },
                    splitLine: { show: false }
                },
                series: [
                    {
                        name: 'Average (All Days)',
                        type: 'line',
                        data: avgData,
                        smooth: true,
                        showSymbol: false,
                        itemStyle: { color: '#CBD5E1' },
                        lineStyle: { width: 2, color: '#CBD5E1' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(203, 213, 225, 0.2)' },
                                { offset: 1, color: 'rgba(203, 213, 225, 0)' }
                            ])
                        }
                    },
                    {
                        name: formatDateDisplay(selectedDate),
                        type: 'line',
                        data: todayData,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        itemStyle: { color: primaryColor, borderColor: '#fff', borderWidth: 2 },
                        lineStyle: { width: 2, color: primaryColor, shadowBlur: 10, shadowColor: 'rgba(56, 116, 255, 0.3)' }
                    }
                ]
            };
            avgHourlyChart.setOption(option);
            window.addEventListener('resize', () => avgHourlyChart?.resize());
        }

        function initDatePicker() {
            const dates = Object.keys(rawData)
                .filter(d => /^\d{4}-\d{1,2}-\d{1,2}$/.test(d))
                .sort((a, b) => new Date(b) - new Date(a));

            // Only reinitialize if enabled dates changed
            if (JSON.stringify(dates) === JSON.stringify(currentEnabledDates)) {
                return;
            }

            // Destroy previous instance
            if (datePickerInstance) {
                datePickerInstance.destroy();
            }

            datePickerInstance = flatpickr('#datePicker', {
                altInput: true,
                altFormat: "M j, Y",
                dateFormat: "Y-m-d",
                defaultDate: selectedDate,
                enable: dates,
                altInputClass: "uppercase tracking-wider bg-slate-100 border-none rounded-full pl-10 pr-4 text-xs font-extrabold text-slate-700 w-[180px] h-10 flex items-center leading-10 transition-all cursor-pointer focus:outline-none focus:ring-0 focus:shadow-none",
                onChange: (selectedDates, dateStr) => {
                    selectedDate = dateStr;
                    updateSelectedDateDisplay(dateStr);
                    renderHourlyChart();
                }
            });

            currentEnabledDates = dates;
        }

        document.getElementById('btnReload').addEventListener('click', loadDataFromGitHub);

        // Initial load
        loadDataFromGitHub();
    </script>
</body>
</html>
