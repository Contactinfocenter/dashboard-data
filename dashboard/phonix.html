<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .chart-container {
      width: 100%;
      height: 100%;
      min-height: 240px;
    }

        /* Chips */
    .chip {
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid rgba(79,70,229,0.2);
      transition: all 0.2s;
      cursor: pointer;
    }

    .chip.selected {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 12px rgba(79,70,229,0.3);
    }

    .chip:hover:not(.selected) {
      background: #e0e7ff;
      transform: translateY(-1px);
    }
    /* Reduce row height and improve readability for ALL tables */
.excel-table td,
.excel-table th {
    padding: 6px 8px !important;
    line-height: 1.3 !important;
    font-size: 0.86rem !important;
}

/* Slightly more space for important rows */
.excel-table tr.grand td,
.excel-table tr.repeat td,
.excel-table tr.row-unique td {
    padding: 7px 8px !important;
}

/* Main table – minimal styling only */
.excel-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.92rem;
}

/* Table header – slate, sticky, rounded top corners */
.excel-table thead th {
    background: #64748b;
    color: #ffffff;
    padding: 12px 8px;
    font-weight: 600;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    z-index: 10;
}
.excel-table thead th:first-child { border-top-left-radius: 12px; }
.excel-table thead th:last-child { border-top-right-radius: 12px; }

/* Table cells */
.excel-table td {
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    background: #ffffff;
    transition: background 0.2s;
}
.excel-table tbody tr:nth-child(even) { background: #f8fafc; }
.excel-table tbody tr:hover { background: #e0e7ff; }

/* Key rows */
.excel-table tr.grand {
    background: #dbeafe !important;
    font-weight: 700;
    color: #1e40af;
}
.excel-table tr.repeat {
    background: #fee2e2 !important;
    font-weight: 600;
    color: #991b1b;
}
.excel-table tr.row-unique {
    color: #64748b;
    font-style: italic;
}

/* Region/Zone names */
td.zone {
    text-align: left !important;
    font-weight: 700;
    color: #1e40af;
    font-size: 0.95rem;
}
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#d9e4f5] to-[#f3f8ff] text-[#0f1724] p-6">
  <div class="max-w-[1600px] mx-auto">

    <!-- PAGE TITLE -->
    <h1 class="text-2xl font-light tracking-widest text-[#1e293b]">
      Call Analysis: Region, Urban & Rural Zones
    </h1>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-4">
      <div class="text-gray-600 text-sm">
        Overview: <strong id="statusText">Initializing...</strong>
      </div>
      <div class="text-xs text-gray-600">
        Last updated: <span id="lastUpdated"></span>
      </div>
    </div>

    <!-- HEADER -->
    <div
      class="sticky top-0 z-50 bg-white/30 backdrop-blur-xl border border-white/40 shadow-lg rounded-2xl p-5 mb-6
             flex flex-col gap-4
             md:flex-row md:items-center md:gap-6">

      <!-- Title -->
      <h2 class="text-xl font-light tracking-widest text-[#1e293b] whitespace-nowrap">
        Call Volume by Region
      </h2>

      <!-- Region Chips -->
      <div
        id="regionChips"
        class="flex flex-wrap gap-2 md:flex-1 md:justify-center md:flex-nowrap md:overflow-x-auto">
      </div>

      <!-- Clear Filters -->
      <button
        id="clearFiltersBtn"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md">
        Clear Filters
      </button>

      <!-- Date + Reset -->
      <div class="flex items-center gap-4 whitespace-nowrap">
        <div class="flex items-center">
          <span class="mr-2">📅</span>
          <input
            id="mainDateRange"
            placeholder="Select date"
            class="bg-white/40 backdrop-blur-xl text-gray-700 text-sm rounded-lg border border-white/40 p-2.5"
          />
        </div>

        <button
          id="clearMainDateBtn"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md"
          aria-label="Reload data">
          Reset
        </button>
      </div>

    </div>

    <!-- MAIN GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Left: 9 columns -->
      <div class="lg:col-span-9 grid grid-cols-1 gap-6">

        <!-- Summary Table -->
<!-- Summary Table -->
<div class="bg-white/70 backdrop-blur-xl border border-white/40 rounded-2xl shadow">
  <div class="p-6 overflow-x-auto">  <!-- Padding + scroll here -->
    <div id="summaryTableContainer">
      <!-- Table will be injected here by JS -->
      <!-- During loading, show centered message -->
      <p class="text-center text-gray-600 py-8">Loading summary data...</p>
    </div>
  </div>
</div>

        <!-- Bar Chart -->
        <div class="bg-white/70 backdrop-blur-xl border border-white/40 rounded-2xl p-6 shadow">
          <canvas id="barChart"></canvas>
        </div>

      </div>

      <!-- Right: 3 columns -->
      <div class="lg:col-span-3 grid grid-cols-1 gap-6">

        <div class="bg-white/70 backdrop-blur-xl border border-white/40 rounded-2xl p-6 shadow">
          <h3 class="text-xl font-light tracking-tight text-gray-900 mb-5">
            Call Reason
          </h3>

          <div class="h-80 flex items-center justify-center">
            <div
              id="reasonChips"
              class="flex flex-wrap gap-2 max-h-[420px] overflow-y-auto text-xs">
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- LIBRARIES -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

  <!-- App Script -->
  <script type="module" src="./app-b-git.js"></script>

</body>
</html>
