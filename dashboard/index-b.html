<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Analysis/Region/Urban/Rural </title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Flowbite -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
   body { 
    font-family: Inter, system-ui, -apple-system, sans-serif; 
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    color: #0f172a;
}

/* Reduce row height and improve readability for ALL tables */
.excel-table td,
.excel-table th {
    padding: 6px 8px !important;
    line-height: 1.3 !important;
    font-size: 0.86rem !important;
}

/* Slightly more space for important rows */
.excel-table tr.grand td,
.excel-table tr.repeat td,
.excel-table tr.row-unique td {
    padding: 7px 8px !important;
}

/* Main table – minimal styling only */
.excel-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.92rem;
}

/* Table header – slate, sticky, rounded top corners */
.excel-table thead th {
    background: #64748b;
    color: #ffffff;
    padding: 12px 8px;
    font-weight: 600;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    z-index: 10;
}
.excel-table thead th:first-child { border-top-left-radius: 12px; }
.excel-table thead th:last-child { border-top-right-radius: 12px; }

/* Table cells */
.excel-table td {
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    background: #ffffff;
    transition: background 0.2s;
}
.excel-table tbody tr:nth-child(even) { background: #f8fafc; }
.excel-table tbody tr:hover { background: #e0e7ff; }

/* Key rows */
.excel-table tr.grand {
    background: #dbeafe !important;
    font-weight: 700;
    color: #1e40af;
}
.excel-table tr.repeat {
    background: #fee2e2 !important;
    font-weight: 600;
    color: #991b1b;
}
.excel-table tr.row-unique {
    color: #64748b;
    font-style: italic;
}

/* Region/Zone names */
td.zone {
    text-align: left !important;
    font-weight: 700;
    color: #1e40af;
    font-size: 0.95rem;
}

#summaryTableContainer,
#zoneSummaryTableContainer,
#ruralSummaryTableContainer {
    overflow: hidden;
    border-radius: 16px; /* or keep rounded-2xl in HTML */
}

/* Base chip style (used by reason chips and as fallback) */
/* Reason Chips - Soft Rounded Pills */
#reasonChips .chip {
  padding: 8px 16px;
  font-size: 0.9rem;
  font-weight: 500;
  color: #475569;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(148, 163, 184, 0.3);
  border-radius: 9999px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}

#reasonChips .chip:hover {
  background: rgba(255, 255, 255, 0.9);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  color: #1e293b;
}

#reasonChips .chip.selected {
  background: #4f46e5;
  color: white;
  border-color: #4f46e5;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
}

/* Region Chips - Underline Touching Text */
#regionChips .chip {
  padding: 12px 0 1px 0; /* Top padding for spacing, bottom for underline */
  font-size: 1.1rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: color 0.3s ease;
  border-bottom: 3px solid transparent; /* Invisible border for consistent spacing */
}

#regionChips .chip:hover {
  color: #4f46e5;
}

#regionChips .chip.selected {
  color: #4f46e5;
  font-weight: 600;
  border-bottom: 3px solid #6366f1; /* Underline touching text */
  border-radius: 2px;
}


/* Buttons */
.filter-btn {
    background: #1e293b;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(30,41,59,0.25);
}
.filter-btn:hover {
    background: #0f172a;
    transform: translateY(-2px);
}

/* Date input */
.filter-input {
    padding: 10px 16px;
    border: 1px solid #d1d5db;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    font-size: 0.9rem;
    transition: all 0.2s;
}
.filter-input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.3);
}

/* Chart */
canvas {
    border-radius: 12px;
    background: transparent;
}

/* Mobile fixes */
@media (max-width: 768px) {
    .excel-table { font-size: 0.8rem; }
    .chip { padding: 4px 8px; font-size: 0.78rem; }
    #regionChips { gap: 8px; }
    #regionChips .chip { padding: 8px 18px !important; font-size: 0.85rem !important; }
}
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#d9e4f5] to-[#f3f8ff] text-[#0f1724] p-6">

  <div class="max-w-[1600px] mx-auto">

    <h1 class="text-2xl font-light tracking-widest text-[#1e293b]">
        Call Analysis: Region, Urban & Rural Zones
    </h1>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-4">
    <!-- Left: Overview status -->
    <div class="text-gray-600 text-sm">
        Overview: <strong id="statusText">Initializing...</strong>
    </div>
    
    <!-- Right: Last updated -->
    <div class="text-xs text-gray-600 text-right sm:text-left">
        Last updated: <span id="lastUpdated"></span>
    </div>
    </div>

    <!-- REGION SECTION -->
        <section class="mb-10 border-b border-white/40">

<header class="sticky top-0 z-50 bg-white/30 backdrop-blur-xl border border-white/40 shadow-lg rounded-2xl p-5 mb-8">
    <div class="flex flex-wrap items-center justify-between gap-4">
        <!-- Title -->
        <h2 class="text-xl font-light tracking-widest text-[#1e293b] whitespace-nowrap">
            Call Volume by Region
        </h2>

        <!-- Region Chips - Plain with Underline Only -->
        <div id="regionChips" class="flex items-center gap-8 flex-1 justify-center">
            <!-- Chips injected by JS -->
        </div>

        <!-- Clear Filters -->
        <button id="clearFiltersBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md">
            Clear Filters
        </button>

        <!-- Date + Reset -->
        <div class="flex items-center gap-4 whitespace-nowrap">
            <div class="flex items-center">
                <span class="mr-2">📅</span>
                <input id="mainDateRange" placeholder="Select date" class="bg-white/40 backdrop-blur-xl text-gray-700 text-sm rounded-lg border border-white/40 p-2.5" />
            </div>

            <button id="clearMainDateBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md" aria-label="Reload data">
                Reset
            </button>
        </div>
    </div>
</header>      

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div class="col-span-3 space-y-6">
                    <div id="summaryTableContainer">
                        <p class="text-center text-gray-600">Loading summary data...</p>
                        <!-- summary table will go here once loaded -->
                    </div>

                    <div class="bg-white/70 p-6 rounded-xl shadow h-80 flex items-center justify-center">
                        <canvas id="barChart"></canvas>
                    </div>

                    <div id="quickStats" class="flex gap-6 text-sm text-gray-700"></div>
                    </div>

                    <div class="space-y-6 sticky top-24 self-start">
                        <div class="bg-white/70 p-5 rounded-xl shadow">
                            <h3 class="font-bold text-[#004c99] mb-3">Call Reason</h3>
                            <div id="reasonChips" class="flex flex-wrap gap-2 max-h-[500px] overflow-y-auto"></div>
                        </div>
                    </div>

                </div>

        </section>



    <!-- URBAN ZONE SECTION -->
    <section class="mb-10 border-b border-white/40">
        <header class="sticky top-0 z-50 bg-white/30 backdrop-blur-xl border border-white/40 shadow-lg rounded-2xl p-5 mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <h2 class="text-xl font-bold text-[#004c99]">Urban Zone Analysis</h2>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Zone Chips -->
                <div class="flex flex-wrap gap-2" id="zoneChips"></div>

                <!-- Filters -->
                <button id="clearZoneFiltersBtn" class="filter-btn">Clear Filters</button>

                <input type="text" 
                    id="zoneDateRange" 
                    placeholder="Select Date Range" 
                    class="filter-input" />

                <button id="clearZoneDateBtn" class="filter-btn">Clear</button>
            </div>

        </div>
        </header>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="col-span-3 space-y-6">
          <div id="zoneSummaryTableContainer">
            <p class="text-center text-gray-600">Loading zone summary data...</p>
          </div>

          <div class="bg-white/70 p-6 rounded-xl shadow h-80 flex items-center justify-center">
            <canvas id="zoneBarChart"></canvas>
          </div>

          <div id="zoneQuickStats" class="flex gap-6 text-sm text-gray-700"></div>
        </div>

        <div class="space-y-6 sticky top-24 self-start">
        <div class="bg-white/70 p-5 rounded-xl shadow">
            <h3 class="font-bold text-[#004c99] mb-3">Call Reason</h3>
            <div id="zoneReasonChips" class="flex flex-wrap gap-2 max-h-[500px] overflow-y-auto"></div>
        </div>
        </div>

      </div>
    </section>

    <!-- RURAL SECTION -->
    <section class="mb-10 border-b border-white/40">

        <header class="sticky top-0 z-50 bg-white/30 backdrop-blur-xl border border-white/40 shadow-lg rounded-2xl p-5 mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <h2 class="text-xl font-bold text-[#004c99]">Rural Top 20 Zone Analysis</h2>

<div class="flex flex-wrap items-center gap-3">

   

    <input type="text" 
        id="ruralDateRange" 
        placeholder="Select Date Range" 
        class="filter-input" />

    <button id="clearRuralDateBtn" class="filter-btn">Clear</button>
</div>

        </div>
        </header>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="col-span-3 space-y-6">
          <div id="ruralSummaryTableContainer">
            <p class="text-center text-gray-600">Loading rural summary data...</p>
          </div>

          <div class="bg-white/70 p-6 rounded-xl shadow h-80 flex items-center justify-center">
            <canvas id="ruralZoneBarChart"></canvas>
          </div>

          <div id="ruralZoneQuickStats" class="flex gap-6 text-sm text-gray-700"></div>
        </div>

        <div class="space-y-6 sticky top-24 self-start">
        <div class="bg-white/70 p-5 rounded-xl shadow">
    <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-[#004c99]">Call Reason</h3>
        <button id="clearRuralFiltersBtn" class="filter-btn">Clear Filters</button>
    </div>
            <div id="ruralZoneReasonChips" class="flex flex-wrap gap-2 max-h-[500px] overflow-y-auto"></div>
        </div>
        </div>

      </div>
    </section>

  </div>

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <!-- Custom Scripts -->


  <!-- app module (ES module) -->
  <script type="module" src="./app-b-git.js"></script>
  
</body>
</html>
