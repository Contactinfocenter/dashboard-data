<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Total Sales Chart Demo</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --phoenix-primary: #3874ff;
            --phoenix-gray-200: #eff2f6;
            --phoenix-gray-300: #e3e6ed;
            --phoenix-gray-500: #9fa6bc;
            --phoenix-gray-700: #525b75;
            --phoenix-gray-900: #212529;
            --phoenix-card-bg: #ffffff;
            --phoenix-body-bg: #f5f7fa;
        }

        body {
            background-color: var(--phoenix-body-bg);
            font-family: 'Nunito Sans', sans-serif;
            padding: 40px 15px;
        }

        /* Replicating the Phoenix Card Component */
        .card-phoenix {
            background-color: var(--phoenix-card-bg);
            border: 1px solid var(--phoenix-gray-300);
            border-radius: 0.6rem;
            box-shadow: none;
        }

        .chart-header h3 {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--phoenix-gray-900);
            margin-bottom: 2px;
        }

        .chart-header p {
            font-size: 0.875rem;
            color: var(--phoenix-gray-500);
            font-weight: 600;
        }

        /* Custom dropdown style to match Phoenix */
        .form-select-phoenix {
            border: 1px solid var(--phoenix-gray-300);
            color: var(--phoenix-gray-700);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 2rem 0.4rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        #totalSalesChart {
            width: 100%;
            height: 350px; /* Standard dashboard height */
        }

        .container {
            max-width: 900px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-phoenix">
        <div class="card-body p-4">
            
            <div class="chart-header d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h3>Total sells</h3>
                    <p class="mb-0">Payment received across all channels</p>
                </div>
                <div>
                    <select class="form-select form-select-phoenix">
                        <option>Mar 1 - 31, 2022</option>
                        <option>April 1 - 30, 2022</option>
                        <option>May 1 - 31, 2022</option>
                    </select>
                </div>
            </div>

            <div id="totalSalesChart"></div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const chartDom = document.getElementById('totalSalesChart');
        const myChart = echarts.init(chartDom);

        // Precise Configuration to match Phoenix v1.24.0
        const option = {
            color: ['#3874ff', '#cbd0dd'],
            tooltip: {
                trigger: 'axis',
                padding: [7, 10],
                backgroundColor: '#fff',
                borderColor: '#e3e6ed',
                textStyle: { color: '#31374a', fontSize: 12, fontWeight: 600 },
                borderWidth: 1,
                transitionDuration: 0,
                axisPointer: { type: 'none' },
                formatter: function(params) {
                    let tooltipHtml = `<div style="margin-bottom: 5px; color: #9fa6bc;">${params[0].axisValue}</div>`;
                    params.forEach(item => {
                        tooltipHtml += `
                            <div style="display: flex; align-items: center; justify-content: space-between; min-width: 150px;">
                                <span style="font-size: 12px;">
                                    <span style="display:inline-block;margin-right:5px;border-radius:10px;width:9px;height:9px;background-color:${item.color};"></span>
                                    ${item.seriesName}
                                </span>
                                <span style="font-weight: 800; margin-left: 20px;">$${item.value}</span>
                            </div>`;
                    });
                    return tooltipHtml;
                }
            },
            legend: {
                show: false 
            },
            grid: {
                top: '10%',
                right: '2%',
                bottom: '10%',
                left: '2%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['Mar 1', 'Mar 5', 'Mar 10', 'Mar 15', 'Mar 20', 'Mar 25', 'Mar 31'],
                boundaryGap: false,
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: {
                    color: '#9fa6bc',
                    margin: 15,
                    fontWeight: 700,
                    fontSize: 11
                }
            },
            yAxis: {
                type: 'value',
                splitLine: {
                    lineStyle: {
                        color: '#eff2f6',
                        type: 'dashed'
                    }
                },
                axisLabel: {
                    color: '#9fa6bc',
                    fontWeight: 700,
                    fontSize: 11,
                    formatter: '${value}'
                }
            },
            series: [
                {
                    name: 'Current Month',
                    type: 'line',
                    data: [100, 320, 260, 480, 340, 580, 480],
                    smooth: 0.4, // Matches Phoenix's "Curvy" style
                    showSymbol: false,
                    z: 10,
                    lineStyle: {
                        width: 2,
                        color: '#3874ff'
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(56, 116, 255, 0.12)' },
                            { offset: 1, color: 'rgba(56, 116, 255, 0)' }
                        ])
                    }
                },
                {
                    name: 'Previous Month',
                    type: 'line',
                    data: [150, 220, 380, 300, 440, 410, 500],
                    smooth: 0.4,
                    showSymbol: false,
                    z: 5,
                    lineStyle: {
                        width: 2,
                        type: 'dashed', // This creates the comparison effect
                        color: '#cbd0dd'
                    }
                }
            ]
        };

        myChart.setOption(option);

        // Responsive resize
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    });
</script>

</body>
</html>
