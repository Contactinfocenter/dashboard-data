<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hourly Call Volume – Enhanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Tabler -->
<link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css" rel="stylesheet">

<!-- Flatpickr -->
<link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

<!-- ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body { background:#f5f7fb; }

.apex-tooltip {
  background: rgba(255,255,255,.97);
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 18px;
  box-shadow: 0 18px 40px -10px rgba(0,0,0,.18);
  font-weight: 600;
  color: #0f172a;
}

#mainChart { height: 420px; }
</style>
</head>

<body>

<div class="page">
<div class="page-wrapper">

<!-- HEADER -->
<div class="page-header">
  <div class="container-xl d-flex justify-content-between align-items-center">
    <div>
      <h2 class="page-title">Hourly Call Volume</h2>
      <div class="text-muted">Daily vs Monthly vs Overall Average</div>
    </div>
    <div class="d-flex gap-2">
      <input id="datePicker" class="form-control">
      <button id="btnReload" class="btn btn-primary">Reload</button>
    </div>
  </div>
</div>

<!-- BODY -->
<div class="page-body">
<div class="container-xl">

<!-- STATS -->
<div class="row row-cards mb-3">
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="subheader">Total Calls</div>
      <div class="h1" id="statTotalCalls">—</div>
    </div></div>
  </div>

  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="subheader">Avg / Hour</div>
      <div class="h1" id="statAvgCalls">—</div>
    </div></div>
  </div>

  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="subheader">Peak Hour</div>
      <div class="h1" id="statPeakHour">—</div>
    </div></div>
  </div>
</div>

<!-- CHART -->
<div class="card">
  <div class="card-body">
    <div id="mainChart"></div>
  </div>
</div>

</div>
</div>
</div>
</div>

<script>
/* ================= CONFIG ================= */
const DATA_URL =
"https://raw.githubusercontent.com/Contactinfocenter/dashboard-data/main/data/calls/all_calls.json";

const HOURS = [...Array(24)].map((_,i)=>`${String(i).padStart(2,'0')}:00`);

let rawData = {};
let selectedDate = null;
let chart = null;
let picker = null;

/* ================= HELPERS ================= */
function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US',{
    month:'short', day:'numeric', year:'numeric'
  });
}

function getCallsForDate(dateStr) {
  if (rawData[dateStr]) return rawData[dateStr];
  const [y,m,d] = dateStr.split('-');
  return rawData[`${y}-${Number(m)}-${Number(d)}`] || {};
}

/* ================= LOAD DATA ================= */
async function loadData() {
  const btn = document.getElementById('btnReload');
  btn.disabled = true;

  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    rawData = (await res.json()).calls || {};

    const dates = Object.keys(rawData)
      .filter(d => /^\d{4}-\d{1,2}-\d{1,2}$/.test(d))
      .sort((a,b)=>new Date(b)-new Date(a));

    selectedDate ??= dates[0];

    initDatePicker(dates);
    renderChart();

  } catch (e) {
    alert("Failed to load data");
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

/* ================= CALCULATIONS ================= */

// Overall average (all data)
function computeOverallAvgHourly() {
  const hourly = Array(24).fill(0);
  let days = 0;

  for (const date in rawData) {
    const daily = Array(24).fill(0);
    let valid = false;

    for (const id in rawData[date]) {
      const h = new Date(rawData[date][id].call_date).getHours();
      if (!isNaN(h)) {
        daily[h]++;
        valid = true;
      }
    }

    if (valid) {
      days++;
      daily.forEach((v,i)=>hourly[i]+=v);
    }
  }

  return hourly.map(v => days && v ? Math.round(v / days) : null);
}

// Monthly average (based on selected date’s month)
function computeMonthlyAvgHourly(dateStr) {
  const target = new Date(dateStr);
  const year = target.getFullYear();
  const month = target.getMonth();

  const hourly = Array(24).fill(0);
  const dayCount = Array(24).fill(0);

  for (const date in rawData) {
    const d = new Date(date);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const daily = Array(24).fill(0);
      let valid = false;

      for (const id in rawData[date]) {
        const h = new Date(rawData[date][id].call_date).getHours();
        if (!isNaN(h)) {
          daily[h]++;
          valid = true;
        }
      }

      if (valid) {
        for (let i = 0; i < 24; i++) {
          hourly[i] += daily[i];
          dayCount[i]++;
        }
      }
    }
  }

  return hourly.map((v,i)=>dayCount[i] ? Math.round(v/dayCount[i]) : null);
}

// Selected day
function computeDayHourly(dateStr) {
  const calls = getCallsForDate(dateStr);
  const hourly = Array(24).fill(0);
  let total = 0;

  for (const id in calls) {
    const h = new Date(calls[id].call_date).getHours();
    if (!isNaN(h)) {
      hourly[h]++;
      total++;
    }
  }

  document.getElementById('statTotalCalls').textContent = total;
  document.getElementById('statAvgCalls').textContent = Math.round(total / 24);

  const peak = Math.max(...hourly);
  const peakHour = hourly.indexOf(peak);
  document.getElementById('statPeakHour').textContent =
    peak ? `${String(peakHour).padStart(2,'0')}:00` : '--';

  return hourly.map(v => v || null);
}

/* ================= CHART ================= */
function renderChart() {
  chart?.destroy();

  const dayData = computeDayHourly(selectedDate);
  const monthlyAvg = computeMonthlyAvgHourly(selectedDate);
  const overallAvg = computeOverallAvgHourly();

  const peakValue = Math.max(...dayData.filter(v => v !== null));
  const peakHour = dayData.indexOf(peakValue);

  chart = new ApexCharts(document.querySelector('#mainChart'), {
    chart: {
      type: 'line',
      height: 420,
      toolbar: false,
      zoom: { enabled: false }
    },

    series: [
      { name: 'Overall Average', data: overallAvg },
      { name: 'Monthly Average', data: monthlyAvg },
      { name: formatDate(selectedDate), data: dayData }
    ],

    stroke: {
      curve: 'smooth',
      width: [2, 2.5, 4],
      dashArray: [6, 4, 0]
    },

    colors: ['#cbd5e1', '#14b8a6', '#2563eb'],

    fill: {
      type: ['gradient','gradient','solid'],
      gradient: { opacityFrom: 0.25, opacityTo: 0 }
    },

    markers: {
      size: [0, 0, 7],
      strokeWidth: 3,
      strokeColors: '#fff'
    },

    annotations: {
      points: peakHour !== -1 ? [{
        x: HOURS[peakHour],
        y: peakValue,
        marker: {
          size: 9,
          fillColor: '#ef4444',
          strokeColor: '#fff',
          strokeWidth: 3
        },
        label: {
          text: `Peak ${peakValue}`,
          style: {
            background: '#ef4444',
            color: '#fff',
            fontWeight: 700
          }
        }
      }] : []
    },

    xaxis: {
      categories: HOURS,
      tickAmount: 8
    },

    legend: {
      position: 'top',
      horizontalAlign: 'right'
    },

    tooltip: {
      shared: true,
      intersect: false,
      y: {
        formatter: v => v !== null ? `${v} calls` : '—'
      }
    }
  });

  chart.render();
}

/* ================= DATE PICKER ================= */
function initDatePicker(dates) {
  picker?.destroy();
  picker = flatpickr('#datePicker', {
    enable: dates,
    defaultDate: selectedDate,
    altInput: true,
    altFormat: 'M j, Y',
    dateFormat: 'Y-m-d',
    onChange: (_, d) => {
      selectedDate = d;
      renderChart();
    }
  });
}

/* ================= INIT ================= */
document.getElementById('btnReload').addEventListener('click', loadData);
loadData();
</script>

</body>
</html>
