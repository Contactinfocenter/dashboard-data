<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Tabler Dashboard - Top Navbar</title>
    
    <!-- Tabler Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <!-- Custom style for sticky navbar, 5-card row, and compact cards -->
    <style>
      .sticky-navbar {
        position: sticky;
        top: 0;
        z-index: 1030;
        background-color: var(--tblr-navbar-bg, #fff);
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
      
      /* 5 cards in a row on lg+ */
      @media (min-width: 992px) {
        .five-cards-row .col-lg {
          flex: 0 0 20%;
          max-width: 20%;
        }
      }
      
      /* Reduced card height: compact padding and smaller heading */
      .compact-card .card-body {
        padding: 0.75rem 1rem !important; /* p-2 equivalent, but tighter */
      }
      
      .compact-card .h1 {
        font-size: 2rem !important; /* Smaller than default h1 */
        line-height: 1.2;
        margin-bottom: 0.25rem !important;
      }
      
      .compact-card .text-muted {
        font-size: 0.875rem !important; /* Slightly smaller label */
      }
    </style>
  </head>
  <body class="d-flex flex-column">
    <!-- Sticky Top Navbar (unchanged) -->
    <header class="navbar navbar-expand-md sticky-navbar d-print-none">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href=".">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            My Dashboard
          </a>
        </h1>
        
        <div class="collapse navbar-collapse" id="navbar-menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#">
                <i class="ti ti-home icon"></i>
                <span class="nav-link-title">Home</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="ti ti-chart-bar icon"></i>
                <span class="nav-link-title">Analytics</span>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
                <i class="ti ti-users icon"></i>
                <span class="nav-link-title">Users</span>
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">List</a></li>
                <li><a class="dropdown-item" href="#">Add New</a></li>
              </ul>
            </li>
          </ul>
          
          <div class="navbar-nav flex-row order-md-last">
            <div class="nav-item d-none d-md-flex me-3">
              <a href="#" class="nav-link px-0" data-bs-toggle="tooltip" title="Search">
                <i class="ti ti-search icon"></i>
              </a>
            </div>
            <div class="nav-item dropdown">
              <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown">
                <span class="avatar avatar-sm" style="background-image: url(https://preview.tabler.io/static/avatars/000m.jpg)"></span>
                <div class="d-none d-xl-block ps-2">
                  <div>John Doe</div>
                  <div class="mt-1 small text-muted">Admin</div>
                </div>
              </a>
              <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                <a href="#" class="dropdown-item">Profile</a>
                <a href="#" class="dropdown-item">Logout</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="page-wrapper flex-grow-1">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title">Dashboard</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <!-- 5 compact cards in a row -->
          <div class="row row-cards five-cards-row g-3"> <!-- Added g-3 for tighter gutters -->
            <div class="col-sm-6 col-lg compact-card">
              <div class="card">
                <div class="card-body text-center">
                  <div class="h1 m-0">123</div>
                  <div class="text-muted mb-0">Orders</div> <!-- Removed mb-3 -->
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg compact-card">
              <div class="card">
                <div class="card-body text-center">
                  <div class="h1 m-0">$4,567</div>
                  <div class="text-muted mb-0">Revenue</div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg compact-card">
              <div class="card">
                <div class="card-body text-center">
                  <div class="h1 m-0">$5,567</div>
                  <div class="text-muted mb-0">Share</div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg compact-card">
              <div class="card">
                <div class="card-body text-center">
                  <div class="h1 m-0">$7,567</div>
                  <div class="text-muted mb-0">Revenue</div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg compact-card">
              <div class="card">
                <div class="card-body text-center">
                  <div class="h1 m-0">$567</div>
                  <div class="text-muted mb-0">Profit</div>
                </div>
              </div>
            </div>
          </div>
          <!-- CHART -->
            <div class="card">
                <div class="card-body">
                    <div id="mainChart"></div>
                </div>
            </div>
        </div>
      </div>
    </div>

    <!-- Tabler JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
  </body>
</html>
