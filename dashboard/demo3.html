<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Total Sells Exact Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; font-family: 'Nunito Sans', sans-serif; padding: 20px; }
        
        .chart-title { font-weight: 800; font-size: 1.5rem; color: #0f172a; margin-bottom: 0; }
        .chart-subtitle { color: #525b75; font-size: 0.95rem; margin-top: 2px; }
        
        .form-select-phoenix {
            border: 1px solid #d1d5db;
            color: #374151;
            font-size: 0.85rem;
            padding: 0.4rem 2.5rem 0.4rem 1rem;
            border-radius: 0.5rem;
            background-color: #fff;
        }

        #totalSellsChart {
            width: 100%;
            height: 400px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 class="chart-title">Total sells</h2>
            <p class="chart-subtitle">Payment received across all channels</p>
        </div>
        <select class="form-select-phoenix w-auto">
            <option>Mar 1 - 31, 2022</option>
        </select>
    </div>

    <div id="totalSellsChart"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const chartDom = document.getElementById('totalSellsChart');
        if (!chartDom) return;

        const myChart = echarts.init(chartDom);

        const days = Array.from({length: 31}, (_, i) => {
            const dayNum = (i + 1).toString().padStart(2, '0');
            return `${dayNum} Mar`;
        });

        const currentSells = [10, 15, 25, 30, 30, 30, 25, 22, 22, 22, 22, 22, 22, 45, 45, 45, 52, 60, 70, 85, 65, 50, 50, 50, 35, 22, 22, 30, 30, 30, 30];
        const previousSells = [20, 20, 18, 12, 10, 8, 8, 8, 8, 8, 8, 8, 8, 8, 8, 20, 40, 40, 40, 62, 75, 55, 38, 42, 48, 55, 50, 48, 45, 42, 42];

        const option = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'line',
                    lineStyle: {
                        color: '#d1d5db',
                        width: 1,
                        type: 'solid'
                    }
                }
            },
            // Added Legend at top-right
            legend: {
                show: true,
                orient: 'horizontal',
                align: 'right',
                right: '5%',
                top: '8%',
                itemWidth: 18,
                itemHeight: 10,
                textStyle: {
                    color: '#525b75',
                    fontSize: 13,
                    fontWeight: 600
                },
                data: [
                    {
                        name: 'Current period',
                        icon: 'roundRect',
                        lineStyle: { width: 2 }
                    },
                    {
                        name: 'Previous period',
                        icon: 'line',
                        lineStyle: { width: 2, type: 'dashed' }
                    }
                ]
            },
            grid: {
                left: '3%',
                right: '4%',
                top: '18%',   // Increased top margin to make room for legend
                bottom: '10%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: days,
                boundaryGap: false,
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: {
                    show: true,
                    color: '#6b7280',
                    fontWeight: 600,
                    margin: 20,
                    formatter: function(value) {
                        const day = parseInt(value.split(' ')[0], 10);
                        if ([1, 15, 31].includes(day)) {
                            return value;
                        }
                        return '';
                    }
                },
                splitLine: {
                    show: true,
                    lineStyle: { color: '#f3f4f6', width: 1 }
                }
            },
            yAxis: {
                type: 'value',
                show: false
            },
            series: [
                {
                    name: 'Current period',   // Matches legend
                    type: 'line',
                    data: currentSells,
                    symbol: 'circle',
                    symbolSize: 8,
                    itemStyle: {
                        color: '#3874ff',
                        borderColor: '#fff',
                        borderWidth: 3
                    },
                    lineStyle: {
                        width: 2,
                        color: '#3874ff'
                    },
                    showSymbol: false,
                    emphasis: {
                        focus: 'series',
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(56, 116, 255, 0.5)',
                            borderWidth: 4
                        }
                    }
                },
                {
                    name: 'Previous period',  // Matches legend
                    type: 'line',
                    data: previousSells,
                    symbol: 'circle',
                    symbolSize: 6,
                    itemStyle: {
                        color: '#3874ff',
                        opacity: 0.8
                    },
                    lineStyle: {
                        width: 2,
                        type: 'dashed',
                        color: '#3874ff'
                    },
                    showSymbol: false,
                    emphasis: {
                        focus: 'series',
                        itemStyle: {
                            opacity: 1,
                            shadowBlur: 10,
                            shadowColor: 'rgba(56, 116, 255, 0.4)'
                        }
                    }
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', () => myChart.resize());
    });
</script>
</body>
</html>
