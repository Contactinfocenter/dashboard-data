<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiceAdmin Reports Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: "Open Sans", sans-serif; background: #f6f9ff; color: #444444; padding: 20px; }
        .dashboard-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: #fff; border: none; border-radius: 5px; box-shadow: 0px 0 30px rgba(1, 41, 112, 0.1); padding: 20px; flex: 1; min-width: 300px; }
        .card-title { font-size: 18px; font-weight: 500; color: #012970; margin-bottom: 20px; }
        .card-title span { color: #899bbd; font-size: 14px; font-weight: 400; }
        #reportsChart { min-height: 350px; }
    </style>
</head>
<body>

    <div class="dashboard-row">
        <div class="card" style="flex: 2;">
            <div class="card-title">Reports <span>/ Today</span></div>
            <div id="reportsChart"></div>
        </div>

        <div class="card">
            <div class="card-title">Website Traffic <span>/ Today</span></div>
            <div id="trafficChart" style="min-height: 400px;"></div>
        </div>
    </div>

    <script>
        // 1. Reports Line Chart (ApexCharts)
        document.addEventListener("DOMContentLoaded", () => {
            new ApexCharts(document.querySelector("#reportsChart"), {
                series: [{
                    name: 'Sales',
                    data: [31, 40, 28, 51, 42, 82, 56],
                }, {
                    name: 'Revenue',
                    data: [11, 32, 45, 32, 34, 52, 41]
                }, {
                    name: 'Customers',
                    data: [15, 11, 32, 18, 9, 24, 11]
                }],
                chart: {
                    height: 350,
                    type: 'area',
                    toolbar: { show: false },
                },
                markers: { size: 4 },
                colors: ['#4154f1', '#2eca6a', '#ff771d'],
                fill: {
                    type: "gradient",
                    gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0.4, stops: [0, 90, 100] }
                },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: {
                    type: 'datetime',
                    categories: ["2023-09-19T00:00:00.000Z", "2023-09-19T01:30:00.000Z", "2023-09-19T02:30:00.000Z", "2023-09-19T03:30:00.000Z", "2023-09-19T04:30:00.000Z", "2023-09-19T05:30:00.000Z", "2023-09-19T06:30:00.000Z"]
                },
                tooltip: { x: { format: 'dd/MM/yy HH:mm' } }
            }).render();

            // 2. Website Traffic Donut Chart (ECharts)
            var trafficChart = echarts.init(document.querySelector("#trafficChart"));
            trafficChart.setOption({
                tooltip: { trigger: 'item' },
                legend: { top: '5%', left: 'center' },
                series: [{
                    name: 'Access From',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    label: { show: false, position: 'center' },
                    emphasis: { label: { show: true, fontSize: '18', fontWeight: 'bold' } },
                    labelLine: { show: false },
                    data: [
                        { value: 1048, name: 'Search Engine' },
                        { value: 735, name: 'Direct' },
                        { value: 580, name: 'Email' },
                        { value: 484, name: 'Union Ads' },
                        { value: 300, name: 'Video Ads' }
                    ]
                }]
            });
        });
    </script>
</body>
</html>
